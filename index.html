<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>Tic <span>Tac</span> Toe</h1>
    <div class="status" id="status">Player <span class="x">X</span>'s turn</div>
    <div class="board" id="board"></div>
    <div class="controls">
      <button class="reset" id="resetBtn">New Round</button>
      <button class="reset" id="resetScoreBtn">Reset Score</button>
    </div>
    <div class="score">
      <span><b class="x">X</b> <span id="scoreX">0</span></span>
      <span>Draws <span id="scoreD">0</span></span>
      <span><b class="o">O</b> <span id="scoreO">0</span></span>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
